<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>احصل على هدايا ومكافآت حصرية</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="loader-overlay" id="loader">
    <div style="text-align:center">
      <div class="loader-spinner"></div>
      <p class="loader-text">جاري البحث عن الهدايا المتاحة في منطقتك...</p>
    </div>
  </div>

  <main class="page">
    <div class="card">
      <div class="card__icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12" />
          <rect x="2" y="7" width="20" height="5" />
          <line x1="12" y1="22" x2="12" y2="7" />
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
        </svg>
      </div>

      <h1 class="card__title">احصل على الهدايا والمكافآت</h1>
      <p class="card__desc">اضغط على الزر أدناه لتفعيل ميزة تحديد الموقع واستعراض الهدايا المتاحة في منطقتك الجغرافية حالياً.</p>

      <button class="btn btn--primary" id="shareBtn" onclick="shareLocation()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12" />
          <rect x="2" y="7" width="20" height="5" />
          <line x1="12" y1="22" x2="12" y2="7" />
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z" />
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z" />
        </svg>
        احصل على الهدايا من هنا
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script type="module" src="supabase.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
